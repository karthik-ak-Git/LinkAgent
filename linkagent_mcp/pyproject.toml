[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "linkagent-mcp"
version = "0.1.0"
description = "LinkedIn MCP server using Chrome DevTools Protocol (CDP)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "websockets>=12.0",
]

[project.scripts]
linkagent-mcp = "linkagent_mcp.server:main"

[tool.setuptools.packages.find]
include = ["linkagent_mcp*"]

[tool.setuptools.package-dir]
linkagent_mcp = "linkagent_mcp"
