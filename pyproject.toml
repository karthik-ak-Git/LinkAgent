[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "linkagent-mcp"
version = "0.1.0"
description = "Universal browser-based extraction via CDP. MCP server for AI agents."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "websockets>=12.0",
]

[project.scripts]
linkagent-mcp = "linkagent_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["linkagent_mcp*"]

[tool.setuptools.package-dir]
linkagent_mcp = "linkagent_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
