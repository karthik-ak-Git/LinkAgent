services:
  # Full stack: Chromium + MCP server (stdio transport)
  linkagent:
    build: .
    container_name: linkagent-mcp
    volumes:
      - chrome-profile:/app/chrome-profile
    environment:
      - CDP_PORT=9222
      - LINKAGENT_LOG_LEVEL=INFO
      - LINKAGENT_SERVER_NAME=linkagent
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9222/json/version', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Chromium only: expose CDP port for external MCP server
  # Use this if you want to run the MCP server on the host
  chromium:
    image: linkagent-linkagent:latest
    container_name: linkagent-chromium
    ports:
      - "9223:9222"
    volumes:
      - chrome-profile:/app/chrome-profile
    entrypoint: >
      /usr/bin/chromium
      --headless=new
      --remote-debugging-address=0.0.0.0
      --remote-debugging-port=9222
      --user-data-dir=/app/chrome-profile
      --no-sandbox
      --disable-gpu
      --disable-dev-shm-usage
      --no-first-run
      --lang=en-US
    restart: unless-stopped

volumes:
  chrome-profile:
